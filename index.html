
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Diwali 🎆</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #170b35, #40104d, #170b35);
    color: white;
    font-family: Georgia, serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    overflow-x: hidden;
}

.container {
    width: 100%;
    max-width: 450px;
    text-align: center;
    padding: 30px 22px;
    border: 1px solid #d9a441;
    border-radius: 20px;
    background: rgba(255,255,255,0.08);
    box-shadow: 0 0 30px #d99a3433;
}

h1 {
    color: #ffd36a;
    font-size: 35px;
    margin-bottom: 15px;
}

.diya {
    font-size: 65px;
    margin: 15px;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 10px orange; }
    to { text-shadow: 0 0 30px gold; }
}

input, textarea {
    width: 100%;
    padding: 13px;
    margin: 10px 0;
    border: none;
    border-radius: 9px;
    font-size: 15px;
}

textarea {
    resize: vertical;
    min-height: 100px;
}

button {
    background: linear-gradient(90deg, #ffb52e, #ffdf80);
    color: #32103a;
    border: none;
    padding: 13px 22px;
    border-radius: 25px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 12px;
}

button:hover {
    transform: scale(1.04);
}

#wishPage {
    display: none;
}

#receiverName {
    color: #ffdb79;
    font-size: 30px;
    margin: 20px 0;
}

#wishMessage {
    font-size: 19px;
    line-height: 1.7;
    margin: 20px 0;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

#shareLink {
    margin-top: 15px;
    font-size: 12px;
    overflow-wrap: anywhere;
}

#editorPage p {
    color: #ffe3a3;
    margin-bottom: 15px;
}

footer {
    margin-top: 25px;
    font-size: 12px;
    color: #e9c68d;
}
</style>
</head>

<body>

<div class="container">

    <!-- EDITOR PAGE -->

    <div id="editorPage">

        <div class="diya">🪔</div>

        <h1>Create Your Wish</h1>

        <p>Make someone's Diwali special!</p>

        <input
            type="text"
            id="name"
            placeholder="Enter receiver's name"
        >

        <textarea
            id="wish"
            placeholder="Enter your Diwali wish..."
        ></textarea>

        <button onclick="generateLink()">
            Generate Diwali Link ✨
        </button>

        <div id="shareLink"></div>

        <button id="copyBtn"
            onclick="copyLink()"
            style="display:none;">
            Copy Link 🔗
        </button>

    </div>


    <!-- RECEIVER PAGE -->

    <div id="wishPage">

        <div class="diya">🪔</div>

        <h1>Happy Diwali!</h1>

        <h2 id="receiverName"></h2>

        <div id="wishMessage"></div>

        <div style="font-size:35px;">
            🎆 🪔 🎇
        </div>

        <footer>
            Made with love ❤️
        </footer>

    </div>

</div>


<script>

// Generate personalised link

let generatedLink = "";

function generateLink() {

    const name = document.getElementById("name").value.trim();

    const wish = document.getElementById("wish").value.trim();

    if (!name || !wish) {
        alert("Please enter the name and Diwali wish!");
        return;
    }

    const url = new URL(window.location.href);

    url.search = "";

    url.searchParams.set("name", name);
    url.searchParams.set("wish", wish);

    generatedLink = url.toString();

    document.getElementById("shareLink").innerText =
        "Your personalised link:\n" + generatedLink;

    document.getElementById("copyBtn").style.display =
        "inline-block";
}


// Copy generated link

function copyLink() {

    navigator.clipboard.writeText(generatedLink)
        .then(() => alert("Diwali link copied successfully! 🎉"))
        .catch(() => alert("Please copy the link manually."));
}


// Display receiver's personalised wish

const params = new URLSearchParams(window.location.search);

const receiver = params.get("name");
const message = params.get("wish");

if (receiver && message) {

    document.getElementById("editorPage").style.display = "none";

    document.getElementById("wishPage").style.display = "block";

    document.getElementById("receiverName").textContent =
        "Dear " + receiver + "!";

    document.getElementById("wishMessage").textContent =
        message;

}

</script>

</body>
</html>
